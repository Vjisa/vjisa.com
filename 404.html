<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 – Stránka nenalezena</title>

  <!-- Používá stejný styl jako zbytek webu -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="error-page">

    <section class="error-box">

      <!-- Animované číslo 404 -->
      <h1 class="error-code">
        <span class="error-digit">4</span>
        <span class="error-digit">0</span>
        <span class="error-digit">4</span>
      </h1>

      <h2 class="error-title">
        Stránka nenalezena
      </h2>

      <p class="error-text">
        Požadovaná stránka neexistuje, byla přesunuta nebo je adresa chybná.
      </p>

      <!-- „Loading / searching“ efekt -->
      <p class="error-loading">
        Hledám správnou cestu
        <span class="loading-dots">
          <span>.</span><span>.</span><span>.</span>
        </span>
      </p>

      <!-- Akce -->
      <div class="error-actions">
        <a href="home.html" class="error-btn">Zpět na Home</a>
        <a href="index.html" class="error-link">Úvodní stránka</a>
        <a href="settings.html" class="error-link">Nastavení</a>
      </div>

    </section>

  </main>

</body>
</html>
