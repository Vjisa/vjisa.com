<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MojeVM – Přihlášení</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body class="theme-light">
  <div class="container" style="max-width: 520px; padding-top: 9vh;">
    <div class="text-center mb-3" style="font-size: 2rem;">☁️ MojeVM</div>

    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Přihlášení</h1>
        <p class="text-muted mb-4">Přihlas se do portálu pro správu virtuálních strojů.</p>

        <div class="mb-3">
          <label class="form-label" for="username">Uživatelské jméno</label>
          <input class="form-control" id="username" autocomplete="username">
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Heslo</label>
          <input class="form-control" id="password" type="password" autocomplete="current-password">
        </div>

        <button class="btn btn-primary w-100" id="loginBtn" type="button">Přihlásit se</button>

        <div class="text-danger small mt-3" id="loginErr" style="display:none"></div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-2 mt-3">
      <button class="btn btn-light btn-sm" id="themeToggle" type="button">🌓 Motiv</button>
    </div>
  </div>

  <script src="auth.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("token")) {
        window.location.href = "home.html";
        return;
      }

      const err = document.getElementById("loginErr");
      const btn = document.getElementById("loginBtn");

      async function login() {
        err.style.display = "none";
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const r = await fetch("https://api.jisavl22.fun/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });

          let d = {};
          try {
            d = await r.json();
          } catch {
            d = {};
          }

          if (!r.ok || !d.ok) {
            if (r.status === 401 || r.status === 403) {
              err.textContent = "Neplatné přihlašovací údaje.";
            } else if (d?.error) {
              err.textContent = d.error;
            } else {
              err.textContent = "Přihlášení selhalo.";
            }
            err.style.display = "";
            return;
          }

          localStorage.setItem("token", d.token);
          localStorage.setItem("role", d.role);
          localStorage.setItem("pool", d.pool ?? "");
          localStorage.setItem("username", username);

          window.location.href = "home.html";
        } catch (e) {
          const msg = String(e?.message || e || "");
          if (msg.toLowerCase().includes("failed to fetch")) {
            err.textContent = "Nepodařilo se spojit se serverem.";
          } else {
            err.textContent = "Přihlášení selhalo. Zkus to znovu.";
          }
          err.style.display = "";
        }
      }

      btn.addEventListener("click", login);
      document.getElementById("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });
    });
  </script>
</body>
</html>
