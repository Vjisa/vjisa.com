<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MojeVM – Vytvoření VM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body class="theme-light" data-require-auth="1" data-page="create">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">☁️</div>
        <div>
          <div class="brand-name">MojeVM</div>
          <small class="brand-subtitle">Portál virtuálních strojů</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" href="home.html"><span class="icon">🏠</span> Dashboard</a>
        <a class="sidebar-link" href="myvm.html"><span class="icon">🖥️</span> Moje VM</a>
        <a class="sidebar-link active" href="vm.html"><span class="icon">➕</span> Vytvořit VM</a>
        <a class="sidebar-link" href="settings.html"><span class="icon">⚙️</span> Nastavení</a>
      </nav>

      <div class="sidebar-footer d-flex gap-2 align-items-center">
        <button class="btn btn-light btn-icon" id="themeToggle" type="button" title="Přepnout motiv">🌓</button>
        <a class="sidebar-link" href="index.html"><span class="icon">🚪</span> Odhlásit se</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Vytvoření VM</h1>
          <p class="page-subtitle">Vyplň parametry a vytvoř VM.</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-light btn-icon" href="myvm.html" title="Zpět">←</a>
          <a class="btn btn-primary" href="myvm.html">Moje VM</a>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-12 col-lg-7">
          <div class="card">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">Parametry</h2>

<div class="text-muted small mb-3">
  Limity uživatele
  <span class="vm-info" data-tip="Limity jsou součtem přes všechny tvoje VM. Typicky: CPU max 8 jader, RAM max 20 GB, disk max 250 GB. Pokud limit překročíš, vytvoření se odmítne.">i</span>
</div>
              
              <div class="mb-3">
                <label class="form-label" for="name">
                    Název VM
                <span class="vm-info" data-tip="Pravidla: 3–32 znaků, jen a–z, 0–9 a pomlčka. Bez mezer. Musí být unikátní. Doporučení: začni prefixem projektu (např. demo-ubuntu-01).">i</span>
                </label>
                  <input class="form-control" id="name" placeholder="demo-ubuntu-01" />
              </div>

              <div class="mb-3">
                <label class="form-label" for="template">Šablona (OS)</label>
                <select class="form-select" id="template">
                  <option value="ubuntu">Ubuntu Server</option>
                  <option value="debian">Debian</option>
                  <option value="windows">Windows</option>
                </select>
              </div>

              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label" for="cores">CPU (cores)</label>
                  <input class="form-control" id="cores"
                         type="number" min="1" max="8" step="1" inputmode="numeric" value="2" />
                </div>

                <div class="col-12 col-md-6">
                  <<label class="form-label" for="memory">RAM (MB)</label>
<input class="form-control" id="memory"
       type="number" min="512" max="16384" step="256" inputmode="numeric"
       list="ramOptions" value="2048" />
<datalist id="ramOptions">
  <option value="512"></option>
  <option value="1024"></option>
  <option value="2048"></option>
  <option value="4096"></option>
  <option value="8192"></option>
  <option value="16384"></option>
</datalist>
                </div>
              </div>

<div class="col-12 col-md-6">
  <label class="form-label" for="slot">VMID slot (0–99)</label>
  <input class="form-control" id="slot" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="nepovinné" />
  <div class="text-muted small mt-1">User uvidí slot, admin plné VMID.</div>
</div>
              
              <div class="d-flex gap-2 mt-4">
                <button class="btn btn-light" id="btnTest" type="button">Test backendu</button>
                <button class="btn btn-primary" id="btnCreate" type="button">Vytvořit VM</button>
              </div>

              <!-- jen krátký status (ne seznam VM, žádné logy) -->
              <div class="text-muted small mt-3" id="status">Připraveno.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- skrytý #out jen kvůli kompatibilitě (neuvidíš ho) -->
      
    </main>
  </div>

  <script src="auth.js" defer></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // template z URL: vm.html?template=debian
      const p = new URLSearchParams(location.search);
      const t = (p.get("template") || "").trim();
      if (t) {
        const sel = document.getElementById("template");
        if (sel) for (const opt of sel.options) if (opt.value === t) sel.value = t;
      }

      // cores: jen celé 1–8
      const cores = document.getElementById("cores");
      if (cores) {
        cores.addEventListener("input", () => {
          if (cores.value === "") return;
          let n = parseInt(cores.value, 10);
          if (Number.isNaN(n)) { cores.value = ""; return; }
          if (n < 1) n = 1;
          if (n > 8) n = 8;
          cores.value = String(n);
        });
      }
    });
  </script>

  <script src="app.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
