<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MojeVM – Moje VM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<script src="auth.js" defer></script>
<body class="theme-light">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">☁️</div>
        <div>
          <div class="brand-name">MojeVM</div>
          <small class="brand-subtitle">Portál virtuálních strojů</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" href="home.html"><span class="icon">🏠</span> Dashboard</a>
        <a class="sidebar-link active" href="myvm.html"><span class="icon">🖥️</span> Moje VM</a>
        <a class="sidebar-link" href="vm.html"><span class="icon">➕</span> Vytvořit VM</a>
        <a class="sidebar-link" href="settings.html"><span class="icon">⚙️</span> Nastavení</a>
      </nav>

      <div class="sidebar-footer">
        <a class="sidebar-link" href="index.html"><span class="icon">🚪</span> Odhlásit se</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Moje VM</h1>
          <p class="page-subtitle">Vytvoření nové VM + seznam VM v poolu.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-light btn-icon" type="button" onclick="location.reload()" title="Obnovit">↻</button>
        </div>
      </div>

      <!-- NAHOŘE: jen 1 tlačítko -->
      <div class="card mb-3">
        <div class="card-body p-4">
          <h2 class="h5 mb-2">Nová VM</h2>
          <p class="text-muted small mb-3">Parametry a OS vybereš na stránce vytvoření.</p>
          <a class="btn btn-primary" href="vm.html">+ Vytvořit VM</a>
        </div>
      </div>

      <!-- DOLE: seznam -->
      <div class="card">
        <div class="card-body p-4">
          <h2 class="h5 mb-3">VM v poolu</h2>
          <div id="out" class="text-muted">Načítám…</div>
        </div>
      </div>
    </main>
  </div>

  <!-- app.js vykresluje seznam do #out -->
  <script src="app.js" defer></script>

  <!-- Zkrášlení tlačítek (bez zásahu do app.js) -->
  <script>
    function styleVmButtons() {
      const out = document.getElementById("out");
      if (!out) return;

      out.querySelectorAll("button").forEach(btn => {
        const t = (btn.textContent || "").trim().toLowerCase();
        btn.classList.add("btn", "btn-sm");

        if (t === "konzole") {
          btn.classList.add("btn-outline-primary");
        } else if (t === "start") {
          btn.classList.add("btn-success");
        } else if (t === "stop") {
          btn.classList.add("btn-warning");
        } else if (t === "smazat") {
          btn.classList.add("btn-danger");
        } else {
          btn.classList.add("btn-outline-secondary");
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      styleVmButtons();
      const out = document.getElementById("out");
      if (!out) return;
      new MutationObserver(styleVmButtons).observe(out, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
