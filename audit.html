<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MojeVM – Audit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body class="theme-light" data-require-auth="1">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">☁️</div>
        <div>
          <div class="brand-name">MojeVM</div>
          <small class="brand-subtitle">Portál virtuálních strojů</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" href="home.html"><span class="icon">🏠</span> Dashboard</a>
        <a class="sidebar-link" href="myvm.html"><span class="icon">🖥️</span> Moje VM</a>
        <a class="sidebar-link" href="vm.html"><span class="icon">➕</span> Vytvořit VM</a>
        <a class="sidebar-link" href="settings.html"><span class="icon">⚙️</span> Nastavení</a>
        <a class="sidebar-link active" data-role="admin" href="audit.html"><span class="icon">🧾</span> Audit</a>
      </nav>

      <div class="sidebar-footer d-flex gap-2 align-items-center">
        <button class="btn btn-light btn-icon" id="themeToggle" type="button" title="Přepnout motiv">🌓</button>
        <a class="sidebar-link" href="#" id="logoutLink"><span class="icon">🚪</span> Odhlásit se</a>
      </div>

      <div class="p-3 small text-muted">
        <div><b data-bind="username">—</b></div>
        <div><span data-bind="role">—</span> | pool: <span data-bind="pool">—</span></div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Audit</h1>
          <p class="page-subtitle">Pouze admin. Poslední akce (login/create/start/stop/delete/console…).</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-light btn-icon" id="refreshAudit" type="button">↻</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-4">
          <div id="auditOut" class="text-muted">Načítám…</div>
        </div>
      </div>
    </main>
  </div>

  <script src="auth.js" defer></script>
  <script>
    async function loadAudit() {
      const out = document.getElementById("auditOut");
      try {
        // Backend si udělej jako GET /api/admin/audit (admin only)
        const rows = await window.__api.apiFetch("/api/admin/audit");
        const list = rows.rows || rows || [];
        if (!list.length) { out.textContent = "Žádné záznamy."; return; }

        const table = document.createElement("table");
        table.className = "table table-sm";
        table.innerHTML = "<thead><tr><th>Čas</th><th>Uživatel</th><th>Akce</th><th>Cíl</th><th>OK</th><th>Detail</th></tr></thead>";
        const tb = document.createElement("tbody");

        for (const r of list) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.ts ?? ""}</td>
            <td>${r.actor ?? ""}</td>
            <td>${r.action ?? ""}</td>
            <td>${r.target ?? ""}</td>
            <td>${r.ok ? "✓" : "✗"}</td>
            <td>${(r.detail ?? "").toString().slice(0, 200)}</td>
          `;
          tb.appendChild(tr);
        }
        table.appendChild(tb);

        out.innerHTML = "";
        out.appendChild(table);
      } catch (e) {
        out.textContent = String(e.message || e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("refreshAudit").addEventListener("click", loadAudit);
      loadAudit();
    });
  </script>
</body>
</html>
